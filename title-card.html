<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Title Card - OIBSIP Level 1</title>
<style>
  :root {
    --bg: #0b0f14;
    --text: #f2f5f8;
    --muted: #9aa6b2;
    --accent: #4ade80;
    --line: rgba(255, 255, 255, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    display: grid;
    place-items: center;
    padding: 6vh 6vw;
    background:
      radial-gradient(60vw 60vw at 85% 15%, rgba(74, 222, 128, 0.10), transparent 60%),
      radial-gradient(50vw 50vw at 10% 90%, rgba(74, 222, 128, 0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    text-align: center;
  }

  main {
    max-width: 1000px;
    width: 100%;
  }

  .kicker {
    display: inline-block;
    padding: 0.55rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: clamp(0.75rem, 1.2vw, 0.95rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  h1 {
    margin: 1.6rem 0 0.6rem;
    font-size: clamp(2.4rem, 7vw, 5.4rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .name {
    color: var(--accent);
  }

  .track {
    margin: 0;
    color: var(--muted);
    font-size: clamp(1rem, 2vw, 1.5rem);
  }

  .divider {
    width: min(360px, 60%);
    height: 1px;
    margin: clamp(1.6rem, 4vh, 2.6rem) auto;
    background: var(--line);
  }

  .task-number {
    margin: 0;
    color: var(--muted);
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  h2 {
    margin: 0.5rem 0 0;
    font-size: clamp(1.5rem, 4vw, 2.9rem);
    line-height: 1.2;
    font-weight: 600;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 2.2rem;
    transform: translateX(-50%);
    margin: 0;
    padding: 0.6rem 1rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(11, 15, 20, 0.85);
    color: var(--muted);
    font-size: 0.85rem;
    opacity: 0;
    animation: hint 6s ease forwards;
    animation-delay: 1.2s;
    pointer-events: none;
  }

  .hint b { color: var(--text); font-weight: 600; }

  @keyframes hint {
    0% { opacity: 0; }
    10%, 75% { opacity: 1; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <main>
    <p class="kicker">Oasis Infobyte Internship</p>
    <h1><span class="name">Zain ul Abdeen</span></h1>
    <p class="track">Web Development &amp; Designing &middot; Level 1</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="task-number" id="task-number">Task 1</p>
    <h2 id="task-title">Landing Page</h2>
  </main>

  <p class="hint">Press <b>1</b>, <b>2</b> or <b>3</b> to change the task. Press <b>F11</b> for fullscreen.</p>

  <script>
    var TASKS = {
      1: "Landing Page",
      2: "Personal Portfolio",
      3: "Temperature Converter"
    };

    var taskNumber = document.getElementById("task-number");
    var taskTitle = document.getElementById("task-title");

    function setTask(n) {
      if (!TASKS[n]) return;
      taskNumber.textContent = "Task " + n;
      taskTitle.textContent = TASKS[n];
      document.title = "Task " + n + " - " + TASKS[n];
      if (history.replaceState) {
        history.replaceState(null, "", "?task=" + n);
      }
    }

    var fromUrl = new URLSearchParams(window.location.search).get("task");
    setTask(fromUrl || 1);

    document.addEventListener("keydown", function (event) {
      if (TASKS[event.key]) setTask(event.key);
    });
  </script>
</body>
</html>
